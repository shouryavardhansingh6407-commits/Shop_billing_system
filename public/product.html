<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="container">
        <h1>Product Management</h1>
        <div class="product-form">
            <h2>Add New Product</h2>
            <form id="productForm">
                <label>Product Name</label>
                <input type="text" id="pName" placeholder="Enter product name" required>
                
                <label>Category</label>
                <select id="pCategory">
                    <option value="Grocery">Grocery</option>
                    <option value="Dairy Products">Dairy Products</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Personal Care">Personal Care</option>
                </select>

                <label>Product Price</label>
                <input type="number" id="pPrice" placeholder="Enter price" required>

                <label>Quantity</label>
                <input type="number" id="pQty" placeholder="Enter quantity" required>

                <button type="button" onclick="addProduct()">Add Product</button>
            </form>
        </div>

        <div class="product-list">
            <h2>Product List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- JS fills this -->
                </tbody>
            </table>
        </div>
        <div class="back"><a href="dashboard.html">Back to Dashboard</a></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
