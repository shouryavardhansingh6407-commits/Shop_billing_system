<!DOCTYPE html>
<html>
<head>
    <title>Billing Page</title>
    <link rel="stylesheet" href="billing.css">
</head>
<body>
    <div class="container">
        <h1>Billing Page</h1>
        <div class="customer">
            <h2>Customer Details</h2>
            <label>Customer Name</label>
            <input type="text" id="custName" placeholder="Enter customer name">
            <label>Mobile Number</label>
            <input type="text" id="custMobile" placeholder="Enter mobile number">
            <label>Bill Number</label>
            <input type="text" id="billNumber" readonly>
        </div>

        <div class="billing">
            <h2>Add Items to Bill</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="itemName" placeholder="Product Name" style="flex: 2;">
                <input type="number" id="itemQty" placeholder="Qty" style="flex: 1;">
                <input type="number" id="itemPrice" placeholder="Price (₹)" style="flex: 1;">
                <button type="button" onclick="addItemToBill()" style="margin: 0;">Add to Cart</button>
            </div>

            <h2>Bill Summary</h2>
            <table>
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="billTableBody">
                    <!-- JS fills this -->
                </tbody>
            </table>
            <div class="total"><h3 id="grandTotalDisplay">Grand Total: ₹0</h3></div>
        </div>

        <div class="buttons">
            <button onclick="generateFinalBill()">Generate Bill</button>
            <button onclick="location.href='dashboard.html'">Back to Dashboard</button>
        </div>
    </div>
    <script src="main.js"></script>
    <script>document.getElementById('billNumber').value = 'BILL-' + Math.floor(Math.random() * 90000);</script>
</body>
</html>
